name: Update GitHub Profile Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate profile analytics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: sangsaptak0704
        run: |
          python <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import datetime
          from pathlib import Path

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          ASSETS = Path("assets")
          ASSETS.mkdir(exist_ok=True)

          def github_api(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "github-profile-analytics"
                  }
              )
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode())

          def graphql(query):
              data = json.dumps({"query": query}).encode()
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=data,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "User-Agent": "github-profile-analytics"
                  }
              )
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode())

          # ---------------------------------------------------------
          # USER DATA
          # ---------------------------------------------------------

          user = github_api(f"https://api.github.com/users/{USERNAME}")

          repos = []
          page = 1

          while True:
              batch = github_api(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not batch:
                  break

              repos.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          total_stars = sum(r.get("stargazers_count", 0) for r in repos)
          total_forks = sum(r.get("forks_count", 0) for r in repos)

          # ---------------------------------------------------------
          # CONTRIBUTIONS
          # ---------------------------------------------------------

          contribution_query = """
          {
            user(login: "%s") {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """ % USERNAME

          contribution_data = graphql(contribution_query)

          calendar = (
              contribution_data
              .get("data", {})
              .get("user", {})
              .get("contributionsCollection", {})
              .get("contributionCalendar", {})
          )

          days = []

          for week in calendar.get("weeks", []):
              for day in week.get("contributionDays", []):
                  days.append(day)

          days.sort(key=lambda x: x["date"])

          total_contributions = calendar.get("totalContributions", 0)

          # ---------------------------------------------------------
          # CURRENT / LONGEST STREAK
          # ---------------------------------------------------------

          current_streak = 0
          longest_streak = 0
          running = 0

          for day in days:
              if day["contributionCount"] > 0:
                  running += 1
                  longest_streak = max(longest_streak, running)
              else:
                  running = 0

          for day in reversed(days):
              if day["contributionCount"] > 0:
                  current_streak += 1
              else:
                  break

          # ---------------------------------------------------------
          # MONTHLY CONTRIBUTION DATA
          # ---------------------------------------------------------

          monthly = {}

          for day in days:
              month = day["date"][:7]
              monthly[month] = monthly.get(month, 0) + day["contributionCount"]

          monthly_items = list(monthly.items())[-12:]

          # ---------------------------------------------------------
          # LANGUAGE DATA
          # ---------------------------------------------------------

          languages = {}

          for repo in repos:
              if repo.get("fork"):
                  continue

              try:
                  lang_data = github_api(
                      f"https://api.github.com/repos/"
                      f"{USERNAME}/{repo['name']}/languages"
                  )

                  for language, amount in lang_data.items():
                      languages[language] = languages.get(language, 0) + amount

              except Exception:
                  pass

          languages = dict(
              sorted(
                  languages.items(),
                  key=lambda item: item[1],
                  reverse=True
              )[:6]
          )

          # ---------------------------------------------------------
          # SVG HELPERS
          # ---------------------------------------------------------

          def esc(value):
              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )

          def svg_start(width, height):
              return f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="{width}" height="{height}"
              viewBox="0 0 {width} {height}">
              <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#0f172a"/>
                  <stop offset="50%" stop-color="#111827"/>
                  <stop offset="100%" stop-color="#172554"/>
                </linearGradient>
                <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#22d3ee"/>
                  <stop offset="100%" stop-color="#3b82f6"/>
                </linearGradient>
              </defs>
              <rect width="100%" height="100%" rx="18" fill="url(#bg)"/>
              '''

          # ---------------------------------------------------------
          # GITHUB STATS SVG
          # ---------------------------------------------------------

          svg = svg_start(900, 300)

          svg += '''
          <text x="45" y="55"
                fill="#ffffff"
                font-size="25"
                font-family="Arial"
                font-weight="bold">
                GitHub Analytics
          </text>

          <text x="45" y="82"
                fill="#94a3b8"
                font-size="14"
                font-family="Arial">
                Live statistics generated from GitHub
          </text>
          '''

          cards = [
              ("Repositories", public_repos),
              ("Stars Received", total_stars),
              ("Followers", followers),
              ("Contributions", total_contributions),
              ("Current Streak", current_streak),
              ("Longest Streak", longest_streak),
          ]

          positions = [
              (35, 110),
              (330, 110),
              (625, 110),
              (35, 205),
              (330, 205),
              (625, 205),
          ]

          for (label, value), (x, y) in zip(cards, positions):
              svg += f'''
              <rect x="{x}" y="{y}"
                    width="255" height="72"
                    rx="12"
                    fill="#111827"
                    stroke="#334155"/>

              <text x="{x + 18}" y="{y + 27}"
                    fill="#94a3b8"
                    font-size="13"
                    font-family="Arial">
                    {esc(label)}
              </text>

              <text x="{x + 18}" y="{y + 55}"
                    fill="url(#blue)"
                    font-size="23"
                    font-family="Arial"
                    font-weight="bold">
                    {esc(value)}
              </text>
              '''

          svg += "</svg>"

          (ASSETS / "github-stats.svg").write_text(
              svg,
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # ACTIVITY GRAPH SVG
          # ---------------------------------------------------------

          svg = svg_start(1000, 360)

          svg += '''
          <text x="40" y="50"
                fill="#ffffff"
                font-size="25"
                font-family="Arial"
                font-weight="bold">
                Contribution Activity
          </text>

          <text x="40" y="76"
                fill="#94a3b8"
                font-size="14"
                font-family="Arial">
                Monthly contribution activity — last 12 months
          </text>
          '''

          if monthly_items:
              max_value = max(v for _, v in monthly_items) or 1

              chart_x = 70
              chart_y = 105
              chart_w = 860
              chart_h = 190

              points = []

              for i, (month, value) in enumerate(monthly_items):
                  x = chart_x + (i * chart_w / max(1, len(monthly_items) - 1))
                  y = chart_y + chart_h - (
                      value / max_value * chart_h
                  )

                  points.append((x, y))

              path = " ".join(
                  ("M" if i == 0 else "L") +
                  f" {x:.1f} {y:.1f}"
                  for i, (x, y) in enumerate(points)
              )

              svg += f'''
              <line x1="{chart_x}" y1="{chart_y + chart_h}"
                    x2="{chart_x + chart_w}" y2="{chart_y + chart_h}"
                    stroke="#334155"/>

              <path d="{path}"
                    fill="none"
                    stroke="#38bdf8"
                    stroke-width="4"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>
              '''

              for i, ((month, value), (x, y)) in enumerate(
                  zip(monthly_items, points)
              ):
                  svg += f'''
                  <circle cx="{x:.1f}" cy="{y:.1f}"
                          r="5"
                          fill="#22d3ee"/>

                  <text x="{x:.1f}"
                        y="{chart_y + chart_h + 25}"
                        fill="#94a3b8"
                        font-size="11"
                        text-anchor="middle"
                        font-family="Arial">
                        {esc(month[5:])}
                  </text>

                  <text x="{x:.1f}"
                        y="{y - 12:.1f}"
                        fill="#ffffff"
                        font-size="11"
                        text-anchor="middle"
                        font-family="Arial">
                        {value}
                  </text>
                  '''

          svg += "</svg>"

          (ASSETS / "activity.svg").write_text(
              svg,
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # STREAK SVG
          # ---------------------------------------------------------

          svg = svg_start(900, 250)

          svg += '''
          <text x="45" y="52"
                fill="#ffffff"
                font-size="25"
                font-family="Arial"
                font-weight="bold">
                Contribution Streak
          </text>
          '''

          streak_cards = [
              ("Current Streak", current_streak),
              ("Longest Streak", longest_streak),
              ("Total Contributions", total_contributions),
          ]

          x_positions = [45, 320, 595]

          for (label, value), x in zip(
              streak_cards,
              x_positions
          ):
              svg += f'''
              <rect x="{x}" y="85"
                    width="235" height="105"
                    rx="15"
                    fill="#111827"
                    stroke="#334155"/>

              <text x="{x + 117}"
                    y="122"
                    text-anchor="middle"
                    fill="#94a3b8"
                    font-size="13"
                    font-family="Arial">
                    {esc(label)}
              </text>

              <text x="{x + 117}"
                    y="163"
                    text-anchor="middle"
                    fill="#38bdf8"
                    font-size="30"
                    font-family="Arial"
                    font-weight="bold">
                    {esc(value)}
              </text>
              '''

          svg += "</svg>"

          (ASSETS / "streak.svg").write_text(
              svg,
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # TOP LANGUAGES SVG
          # ---------------------------------------------------------

          svg = svg_start(900, 330)

          svg += '''
          <text x="45" y="52"
                fill="#ffffff"
                font-size="25"
                font-family="Arial"
                font-weight="bold">
                Top Languages
          </text>
          '''

          total_language_bytes = sum(languages.values()) or 1

          y = 95

          for language, amount in languages.items():
              percentage = amount / total_language_bytes * 100

              svg += f'''
              <text x="50"
                    y="{y}"
                    fill="#e2e8f0"
                    font-size="14"
                    font-family="Arial">
                    {esc(language)}
              </text>

              <rect x="180" y="{y - 14}"
                    width="560"
                    height="13"
                    rx="6"
                    fill="#1e293b"/>

              <rect x="180" y="{y - 14}"
                    width="{5.6 * percentage:.1f}"
                    height="13"
                    rx="6"
                    fill="url(#blue)"/>

              <text x="765"
                    y="{y}"
                    fill="#94a3b8"
                    font-size="13"
                    font-family="Arial">
                    {percentage:.1f}%
              </text>
              '''

              y += 38

          svg += "</svg>"

          (ASSETS / "top-languages.svg").write_text(
              svg,
              encoding="utf-8"
          )

          print("======================================")
          print("GitHub Profile Analytics Generated")
          print("======================================")
          print(f"Repositories: {public_repos}")
          print(f"Stars: {total_stars}")
          print(f"Followers: {followers}")
          print(f"Contributions: {total_contributions}")
          print(f"Current streak: {current_streak}")
          print(f"Longest streak: {longest_streak}")
          print(f"Languages: {languages}")
          print("Generated assets:")
          print("- assets/github-stats.svg")
          print("- assets/activity.svg")
          print("- assets/streak.svg")
          print("- assets/top-languages.svg")
          PY

      - name: Commit generated analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          if git diff --cached --quiet; then
            echo "No analytics changes detected."
          else
            git commit -m "chore: update GitHub profile analytics"
            git push
          fi
